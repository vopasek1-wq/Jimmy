name: Windows build

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení (portable .exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Zkušební spuštění aplikace
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\win-unpacked\AI Dashboard.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Aplikace se ukončila s kódem $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Aplikace běží."

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Dashboard-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Zveřejnění ke stažení (GitHub Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest-build
          name: AI Dashboard pro Windows
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Ke stažení:**
            - `AI-Dashboard-1.0.0-portable.exe` – stačí stáhnout a spustit (bez instalace)
            - `AI-Dashboard-Setup-1.0.0.exe` – instalátor se zástupcem na ploše

            Windows může při prvním spuštění zobrazit modré okno „Systém Windows ochránil váš počítač“:
            klikněte na **Další informace** → **Přesto spustit**.

            Sestaveno z commitu ${{ github.sha }}.
          files: |
            dist/AI-Dashboard-1.0.0-portable.exe
            dist/AI-Dashboard-Setup-1.0.0.exe

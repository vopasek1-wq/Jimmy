name: Windows build

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write # mazání starých buildů (artefaktů)

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení (portable .exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Zkušební spuštění aplikace
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\win-unpacked\JIMMY.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Aplikace se ukončila s kódem $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Aplikace běží."

      # Uchovat jen 5 posledních verzí: před nahráním nové nechat 4 nejnovější.
      - name: Smazat starší buildy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq '.artifacts | sort_by(.created_at) | reverse | .[4:] | .[].id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "Smazán artefakt $id"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: JIMMY-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

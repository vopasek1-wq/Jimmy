name: Windows build

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení (portable .exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Zkušební spuštění aplikace
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\win-unpacked\JIMMY.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Aplikace se ukončila s kódem $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Aplikace běží."

      - uses: actions/upload-artifact@v4
        with:
          name: JIMMY-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 3 # starší buildy se mažou samy (limit úložiště artefaktů)

name: Windows build

on:
  push:
    branches: ["**"]
    paths-ignore: ["README.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write # vydání (Releases) s hotovým JIMMY.exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení (portable .exe)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Zkušební spuštění aplikace
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\win-unpacked\JIMMY.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Aplikace se ukončila s kódem $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Aplikace běží."

      # Každá verze jako vydání (Releases): jeden soubor JIMMY.exe ke stažení.
      # Vydání se nepočítají do limitu úložiště artefaktů Actions.
      - name: Vydání na GitHubu
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          cp dist/JIMMY-*-portable.exe dist/JIMMY.exe
          {
            echo "Sestaveno $(date -u +'%d.%m.%Y %H:%M') UTC z commitu ${GITHUB_SHA::7}."
            echo
            echo "**Změna:** $(git log -1 --pretty=%s)"
            echo
            echo "Stáhni **JIMMY.exe** a spusť – bez instalace. Pokud Windows SmartScreen zobrazí varování: Další informace → Přesto spustit."
          } > notes.md
          # opakované spuštění téhož běhu vydání nahradí
          gh release delete "$TAG" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" dist/JIMMY.exe --target "$GITHUB_SHA" \
            --title "J.I.M.M.Y. – verze ${{ github.run_number }}" --notes-file notes.md --latest

      # Uchovat jen 5 posledních verzí.
      - name: Smazat starší vydání
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq 'sort_by(.created_at) | reverse | .[5:] | .[].tag_name' | tr -d '\r' |
          while read -r tag; do
            gh release delete "$tag" --cleanup-tag --yes && echo "Smazáno vydání $tag"
          done
